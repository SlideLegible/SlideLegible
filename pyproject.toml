[tool.uv.workspace]
members = ["packages/core", "apps/web/backend", "apps/mcp"]

[tool.uv.sources]
slidelegible-core = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "lxml-stubs>=0.5.1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/web/backend/tests"]
pythonpath = ["packages/core/src", "apps/web/backend/src", "tests/fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["slidelegible", "slidelegible_web", "slidelegible_mcp"]
mypy_path = "packages/core/src:apps/web/backend/src:apps/mcp/src"
