[tool.uv.workspace]
members = ["packages/core"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
pythonpath = ["packages/core/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["slidelegible"]
mypy_path = "packages/core/src"
