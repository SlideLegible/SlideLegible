[project]
name = "slidelegible-web-backend"
version = "0.1.0"
description = "Web API adapter for SlideLegible."
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "slidelegible-core",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidelegible_web"]
