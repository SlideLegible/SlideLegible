[project]
name = "slidelegible-mcp"
version = "0.1.0"
description = "MCP server adapter for SlideLegible."
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "mcp>=1,<2",
    "slidelegible-core",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidelegible_mcp"]
